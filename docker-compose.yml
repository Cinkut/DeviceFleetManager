services:
  db:
    image: postgres:17
    container_name: devicefleet-postgres
    environment:
      POSTGRES_DB: devicefleet
      POSTGRES_USER: devicefleet
      POSTGRES_PASSWORD: devicefleet_dev
    ports:
      - "5433:5432"
    volumes:
      - devicefleet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicefleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devicefleet-api
    depends_on:
      db:
        condition: service_healthy   # API startuje dopiero gdy baza jest gotowa
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Wewnątrz sieci Dockera baza jest pod nazwą serwisu "db" na porcie 5432.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=devicefleet;Username=devicefleet;Password=devicefleet_dev"
    ports:
      - "8080:8080"

volumes:
  devicefleet-pgdata:
